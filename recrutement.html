<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phil-Mobile – Redirection...</title>
<meta http-equiv="refresh" content="0;url=https://app.phil-mobile.be/wp_contact.html?c=delta835&type=consultant">
<link rel="icon" type="image/png" href="images/logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', Arial, sans-serif;
    background: #0c1a4a;
    color: white;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .box { max-width: 420px; }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.25);
    border-top-color: #f59e0b;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin-bottom: 8px; }
  p { font-size: 14px; color: rgba(255,255,255,0.75); }
  a { color: #f59e0b; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Redirection en cours...</h1>
    <p>Si la page ne s'ouvre pas automatiquement, <a id="fallback-link" href="https://app.phil-mobile.be/wp_contact.html?c=delta835&type=consultant">cliquez ici</a>.</p>
  </div>
<script>
(function() {
  var target = 'https://app.phil-mobile.be/wp_contact.html?c=delta835&type=consultant';
  var params = new URLSearchParams(window.location.search);
  var source = params.get('source');
  if (source) {
    target += '&source=' + encodeURIComponent(source);
  }
  document.getElementById('fallback-link').href = target;
  window.location.replace(target);
})();
</script>
</body>
</html>
