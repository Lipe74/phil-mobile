<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Nunito', sans-serif;
  color: #1e293b;
  overflow-x: hidden;
  display: flex; flex-direction: column;
}
img { max-width: 100%; display: block; }

:root {
  --blue: #1a56db;
  --blue2: #1e40af;
  --blue-pale: #eff6ff;
  --blue-border: #bfdbfe;
  --navy: #0c1a4a;
  --accent: #f59e0b;
  --accent2: #d97706;
  --dark: #0f172a;
  --muted: #64748b;
  --white: #ffffff;
  --green: #25d366;
  --max: 1100px;
}

/* ===== NAV ===== */
nav {
  position: sticky; top: 0; z-index: 999; flex: 0 0 auto;
  background: var(--white);
  border-bottom: 3px solid var(--blue);
  box-shadow: 0 2px 16px rgba(30,64,175,0.10);
}
.nav-inner {
  max-width: var(--max); margin: 0 auto; padding: 12px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.nav-logo img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
.logo-text { display: flex; flex-direction: column; line-height: 1.1; }
.nav-logo span { font-size: 20px; font-weight: 900; color: var(--blue); }
.site-version { font-size: 10px; font-weight: 600; color: #999; margin-top: 2px; }
.nav-links { display: flex; align-items: center; gap: 8px; }
.nav-links a {
  font-size: 13px; font-weight: 600; color: var(--muted);
  text-decoration: none; padding: 6px 12px; border-radius: 8px;
  transition: all 0.2s;
}
.nav-links a:hover { color: var(--blue); background: var(--blue-pale); }
.nav-links .nav-cta {
  background: var(--green); color: white !important;
  padding: 8px 16px; border-radius: 10px; font-weight: 700;
  display: flex; align-items: center; gap: 6px;
}
.nav-links .nav-cta:hover { background: #1da851; }
.ico-wa { width: 22px; height: 22px; fill: white; flex-shrink: 0; }
.burger {
  display: none; flex-direction: column; gap: 5px;
  cursor: pointer; padding: 6px; border: none; background: none;
}
.burger span {
  display: block; width: 24px; height: 2px;
  background: var(--blue); border-radius: 2px;
  transition: all 0.3s;
}
.mobile-menu {
  display: none;
  background: var(--white); border-top: 1px solid var(--blue-border);
  padding: 12px 20px 16px;
}
.mobile-menu.open { display: block; }
.mobile-menu a {
  display: block;
  font-size: 15px; font-weight: 700; color: var(--dark);
  text-decoration: none; padding: 12px 0;
  border-bottom: 1px solid var(--blue-border);
}
.mobile-menu a:last-child { border-bottom: none; margin-top: 8px; }
.mobile-menu .mob-cta {
  display: block;
  background: var(--green); color: white !important;
  padding: 12px 16px; border-radius: 10px;
  text-align: center; border: none !important;
}
@media (max-width: 640px) {
  .nav-links { display: none; }
  .burger { display: flex; }
}

/* ===== IFRAME CONTACT ===== */
.contact-frame-wrap { flex: 1 1 auto; background: var(--blue-pale); }
.contact-frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
</style>
</head>

<!-- CONTACT (app.phil-mobile.be, affiché sur le site) -->
<div class="contact-frame-wrap">
  <iframe id="contactFrame" title="Simulation gratuite Phil-Mobile" src="https://app.phil-mobile.be/wp_contact.html?c=delta835&type=client&source=site" loading="lazy"></iframe>
</div>

<script>
function toggleMenu() {
  document.getElementById('mobileMenu').classList.toggle('open');
}
/* Transmet le ?source= d'origine à l'iframe si présent (sinon "site" par défaut) */
(function() {
  var params = new URLSearchParams(window.location.search);
  var source = params.get('source');
  if (source) {
    var frame = document.getElementById('contactFrame');
    frame.src = 'https://app.phil-mobile.be/wp_contact.html?c=delta835&type=client&source=' + encodeURIComponent(source);
  }
})();
</script>
